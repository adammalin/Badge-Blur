name: Build installable apps

# Deliberately manual or version-tag only. Ordinary branch pushes must not
# spend runner time rebuilding the model-heavy installers.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate package version and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/validate-release-metadata.mjs "$GITHUB_REF_NAME"

      - name: Validate manual release candidate metadata
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/validate-release-metadata.mjs

  macos-arm64:
    name: macOS Electron Apple Silicon
    needs: release-preflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Build macOS DMG helpers
        run: npm rebuild macos-alias fs-xattr

      - name: Restore local model cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: public/models
          key: badge-blur-models-${{ runner.os }}-${{ hashFiles('scripts/download-grounding-dino-model.sh', 'scripts/download-clip-classifier.sh') }}

      - name: Download and verify local models
        run: npm run prepare

      - name: Run deterministic test suite
        run: npm test

      - name: Build Electron Mac ZIP and DMG
        run: npm run package:mac

      - name: Test local server lifecycle
        run: npm run test:lifecycle

      - name: Test packaged Electron runtime
        timeout-minutes: 5
        run: |
          BADGE_BLUR_SMOKE_TEST=1 \
            "out/Badge Blur-darwin-arm64/Badge Blur.app/Contents/MacOS/Badge Blur"

      - name: Verify Mac artifacts
        run: |
          codesign --verify --deep --strict \
            "out/Badge Blur-darwin-arm64/Badge Blur.app"
          cd releases
          shasum -a 256 -c Badge-Blur-Mac-arm64-v*.zip.sha256
          shasum -a 256 -c Badge-Blur-Mac-arm64-v*.dmg.sha256

      - name: Archive Mac artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: badge-blur-macos-arm64
          path: |
            releases/Badge-Blur-Mac-arm64-v*.zip
            releases/Badge-Blur-Mac-arm64-v*.zip.sha256
            releases/Badge-Blur-Mac-arm64-v*.dmg
            releases/Badge-Blur-Mac-arm64-v*.dmg.sha256
          compression-level: 0

  windows-x64:
    name: Windows Electron x64 installer
    needs: release-preflight
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Windows installer helper
        run: npm rebuild electron-winstaller

      - name: Restore local model cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: public/models
          key: badge-blur-models-${{ runner.os }}-${{ hashFiles('scripts/download-grounding-dino-model.sh', 'scripts/download-clip-classifier.sh') }}

      - name: Download and verify local models
        shell: bash
        run: npm run prepare

      - name: Run deterministic test suite
        run: npm test

      - name: Build Electron Windows installer
        run: npm run package:windows:installer

      - name: Test local server lifecycle
        run: npm run test:lifecycle

      - name: Test packaged Electron runtime
        timeout-minutes: 5
        shell: powershell
        run: |
          $env:BADGE_BLUR_SMOKE_TEST = "1"
          $app = Get-ChildItem `
            -Path "out/Badge Blur-win32-x64" `
            -Filter "Badge Blur.exe" |
            Select-Object -First 1
          if (-not $app) {
            throw "Packaged Badge Blur executable was not found."
          }
          $stdoutLog = Join-Path $env:RUNNER_TEMP "badge-blur-smoke-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "badge-blur-smoke-stderr.log"
          $process = Start-Process `
            -FilePath $app.FullName `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
            if (Test-Path $stderrLog) { Get-Content $stderrLog }
            throw "Packaged Electron smoke test timed out."
          }
          $process.Refresh()
          $stdoutContent = if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog -Raw
          } else {
            ""
          }
          if ($stdoutContent) { Write-Host $stdoutContent }
          if (Test-Path $stderrLog) { Get-Content $stderrLog }
          $smokePassed = $stdoutContent.Contains(
            'BADGE_BLUR_ELECTRON_SMOKE {"passed":true'
          )
          if (-not $smokePassed) {
            throw "Packaged Electron smoke result was incomplete."
          }
          if (-not $process.HasExited) {
            throw "Electron remained active after its successful smoke test."
          }
          $exitCode = $process.ExitCode
          if ($null -ne $exitCode -and [int]$exitCode -ne 0) {
            throw "Electron returned Windows exit code $exitCode after its smoke test."
          }

      - name: Verify Windows artifact
        shell: powershell
        run: |
          $installer = Get-ChildItem releases/Badge-Blur-Windows-x64-Setup-v*.exe
          $expected = (Get-Content "$($installer.FullName).sha256").Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          if ($actual.ToLowerInvariant() -ne $expected.ToLowerInvariant()) {
            throw "Windows installer checksum mismatch."
          }

      - name: Archive Windows artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: badge-blur-windows-x64
          path: |
            releases/Badge-Blur-Windows-x64-Setup-v*.exe
            releases/Badge-Blur-Windows-x64-Setup-v*.exe.sha256
          compression-level: 0

  publish-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download qualified installer artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Badge Blur ${GITHUB_REF_NAME#v}" \
            --notes-file "release-notes/$GITHUB_REF_NAME.md" \
            --latest \
            release-assets/*
