name: Build installable apps

# Deliberately manual or version-tag only. Ordinary branch pushes must not
# spend runner time rebuilding the model-heavy installers.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Download and verify local models
        run: npm run prepare

      - name: Build Mac ZIP and DMG
        run: npm run package:mac

      - name: Test local server lifecycle
        run: npm run test:lifecycle

      - name: Verify Mac artifacts
        run: |
          cd releases
          shasum -a 256 -c Badge-Blur-Mac-arm64-v*.zip.sha256
          shasum -a 256 -c Badge-Blur-Mac-arm64-v*.dmg.sha256

      - name: Archive Mac artifacts
        uses: actions/upload-artifact@v6
        with:
          name: badge-blur-macos-arm64
          path: |
            releases/Badge-Blur-Mac-arm64-v*.zip
            releases/Badge-Blur-Mac-arm64-v*.zip.sha256
            releases/Badge-Blur-Mac-arm64-v*.dmg
            releases/Badge-Blur-Mac-arm64-v*.dmg.sha256
          compression-level: 0

  windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Download and verify local models
        shell: bash
        run: npm run prepare

      - name: Build production interface
        run: npm run build

      - name: Test local server lifecycle
        run: npm run test:lifecycle

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: ./scripts/build-windows-installer.ps1

      - name: Verify Windows artifact
        shell: powershell
        run: |
          $installer = Get-ChildItem releases/Badge-Blur-Windows-x64-Setup-v*.exe
          $expected = (Get-Content "$($installer.FullName).sha256").Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          if ($actual.ToLowerInvariant() -ne $expected.ToLowerInvariant()) {
            throw "Windows installer checksum mismatch."
          }

      - name: Archive Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: badge-blur-windows-x64
          path: |
            releases/Badge-Blur-Windows-x64-Setup-v*.exe
            releases/Badge-Blur-Windows-x64-Setup-v*.exe.sha256
          compression-level: 0
